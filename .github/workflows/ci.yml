name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend build
        run: npm run build

  backend:
    name: Backend Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql

      - name: PHP lint
        run: |
          find backend -path "backend/public/uploads" -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l
