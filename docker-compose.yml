version: '3.9'

services:
  db:
    image: mysql:8.4
    container_name: mediflow-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mediflow_hospital
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - mediflow_mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_DEBUG: 'true'
      APP_KEY: aaf4ed85ebe98afb5e69113d93c67f90ee2ad8c93fb553830bb4ad5a03e0dba7
      APP_URL: http://localhost:8000
      APP_PUBLIC_HOST: localhost
      APP_PUBLIC_PORT: '8000'
      APP_TIMEZONE: Africa/Casablanca
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: mediflow_hospital
      DB_USER: root
      DB_PASS: root
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - '8000:80'
    volumes:
      - ./backend/storage:/var/www/html/storage
      - ./backend/public/uploads:/var/www/html/public/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mediflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api
      VITE_BACKEND_PROXY_TARGET: http://backend
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - mediflow_node_modules:/app/node_modules

volumes:
  mediflow_mysql_data:
  mediflow_node_modules:
